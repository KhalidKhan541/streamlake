[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlake"
version = "0.1.0"
description = "Real-time event streaming into a Parquet + DuckDB lakehouse."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KhalidKhan541" }]
dependencies = [
    "confluent-kafka>=2.4,<3",
    "duckdb>=1.1,<2",
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "matplotlib>=3.8",
]

[project.scripts]
streamlake = "streamlake.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["streamlake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
